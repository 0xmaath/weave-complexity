name = "Complexity"
defaultTargets = ["Complexity", "ReticuliProver"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "Complexity"
# Build the root module and every module under Complexity/, including the
# generated StatementCheck module that re-elaborates the archived statements.
globs = ["Complexity.*"]

[[lean_lib]]
name = "ReticuliProver"
# SHA-256 (FIPS 180-4) and the proof-of-work target condition; a self-contained file
# (no Mathlib import) laid out as `lean/ReticuliProver/SHA256.lean`.
srcDir = "lean"
roots = ["ReticuliProver.SHA256"]
